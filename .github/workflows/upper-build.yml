name: upper-build

on:
    push:
        paths:
            - ".github/workflows/upper-build.yml"
            - "upper/**"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - run: pwd && ls -al
            - uses: actions/checkout@v4
            - run: pwd && ls -al
            - run: go version
            - uses: actions/setup-go@v5
            - run: go version
            - run: go build
              working-directory: ./upper
            - run: go test -v
              working-directory: ./upper
            - run: |
                ls
                go build
                ls
                go test
                ./upper foo the bar